<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1383 KTV - Admin Portal</title>
    <link rel="stylesheet" href="../styles/bookingadmin.css">
</head>
<body>

<div id="login-view" class="login-container">
    <div class="login-card">
        <h2>Admin Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="login-user" class="neon-input" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-pass" class="neon-input" placeholder="Enter password">
        </div>
        <button class="btn-primary" onclick="handleLogin()">Login</button>
    </div>
</div>

<div id="dashboard-view" class="dashboard-container">
    <nav class="admin-nav">
        <div class="logo">1383 KTV Admin</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('bookings')">Bookings</button>
            <button class="tab-btn" onclick="switchTab('settings')">Admin Settings</button>
        </div>
        <div>
            <span id="welcome-msg" style="margin-right: 20px; color: var(--text-muted);"></span>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <section id="tab-bookings" class="content-section active">
        <div class="section-header">
            <h2>Recent Bookings</h2>
            <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="loadBookings()">🔄 Refresh</button>
        </div>

        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Date & Time</th>
                <th>Room</th>
                <th>Duration</th>
                <th>Party Size</th>
                <th>Customer Name</th>
                <th>Phone</th>
                <th>Deposit</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="bookings-table-body">
            </tbody>
        </table>

        <div class="section-header" style="margin-top: 50px;">
            <h2>Weekly Timetable</h2>
            <div class="week-nav" style="display: flex; align-items: center;">
                <button class="btn-primary" style="width: auto; padding: 5px 15px; background: transparent; border: 1px solid var(--primary-blue);" onclick="changeWeek(-1)">◀ Prev</button>
                <h3 id="week-display" style="margin: 0 20px; color: var(--primary-blue);">Week of ...</h3>
                <button class="btn-primary" style="width: auto; padding: 5px 15px; background: transparent; border: 1px solid var(--primary-blue);" onclick="changeWeek(1)">Next ▶</button>
            </div>
        </div>

        <div class="uni-timetable" id="timetable-container">
        </div>
    </section>

    <section id="tab-settings" class="content-section">
        <div class="section-header">
            <h2>Admin Management</h2>
            <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="openAddAdminModal()">+ Add New Admin</button>
        </div>

        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="admins-table-body">
            </tbody>
        </table>
    </section>
</div>

<div id="add-admin-modal" class="modal-overlay">
    <div class="modal-content">
        <h3>Add New Admin</h3>
        <div class="input-group">
            <label>New Username</label>
            <input type="text" id="new-admin-user" class="neon-input">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="new-admin-pass" class="neon-input">
        </div>
        <div class="modal-actions">
            <button class="btn-primary" style="background: transparent; border: 1px solid var(--text-muted);" onclick="closeModal('add-admin-modal')">Cancel</button>
            <button class="btn-primary" style="width: auto;" onclick="submitNewAdmin()">Add Admin</button>
        </div>
    </div>
</div>

<div id="edit-pass-modal" class="modal-overlay">
    <div class="modal-content">
        <h3>Change Password</h3>
        <p id="edit-pass-username" style="color: var(--text-muted); margin-bottom: 15px;"></p>
        <input type="hidden" id="edit-admin-id">
        <div class="input-group">
            <label>New Password</label>
            <input type="password" id="edit-new-pass" class="neon-input">
        </div>
        <div class="modal-actions">
            <button class="btn-primary" style="background: transparent; border: 1px solid var(--text-muted);" onclick="closeModal('edit-pass-modal')">Cancel</button>
            <button class="btn-primary" style="width: auto;" onclick="submitNewPassword()">Save Changes</button>
        </div>
    </div>
</div>

<div id="edit-booking-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 600px;"> <h3>Edit Booking #<span id="edit-b-id-display"></span></h3>
        <input type="hidden" id="edit-b-id">

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>Date</label>
                <input type="date" id="edit-b-date" class="neon-input">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Time</label>
                <input type="time" id="edit-b-time" class="neon-input">
            </div>
        </div>

        <div class="input-group">
            <label>Room</label>
            <select id="edit-b-room" class="neon-input" style="background-color: rgba(17, 24, 39, 0.9);">
                <option value="Small Room">Small Room</option>
                <option value="Medium Room">Medium Room</option>
                <option value="VIP Room">VIP Room</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>Duration (Hours)</label>
                <input type="number" id="edit-b-duration" class="neon-input" min="1">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Party Size</label>
                <input type="number" id="edit-b-party" class="neon-input" min="1">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>Customer Name</label>
                <input type="text" id="edit-b-name" class="neon-input">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Phone</label>
                <input type="text" id="edit-b-phone" class="neon-input">
            </div>
            <div class="input-group" style="flex: 1;">
                <label style="color: #10B981;">Deposit Paid?</label>
                <select id="edit-b-deposit" class="neon-input" style="background-color: rgba(17, 24, 39, 0.9); border-color: #10B981;">
                    <option value="No">No 🔴</option>
                    <option value="Yes">Yes 🟢</option>
                </select>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-primary" style="background: transparent; border: 1px solid var(--text-muted);" onclick="closeModal('edit-booking-modal')">Cancel</button>
            <button class="btn-primary" style="width: auto;" onclick="submitEditBooking()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    // ======================= 全局变量 (用于周历计算) =======================
    let allBookingsData = [];
    let currentWeekOffset = 0; // 0=本周，-1=上周，1=下周

    // 页面加载时检查登录状态
    window.onload = () => {
        const currentUser = sessionStorage.getItem('currentUser');
        if (currentUser) {
            showDashboard(currentUser);
        }
    };

    function getAuthHeaders() {
        return {
            'Content-Type': 'application/json',
            'x-admin-username': sessionStorage.getItem('currentUser')
        };
    }

    async function handleLogin() {
        const user = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value.trim();
        if(!user || !pass) return alert('Please enter username and password');

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            const data = await res.json();
            if (res.ok) {
                sessionStorage.setItem('currentUser', data.username);
                showDashboard(data.username);
            } else {
                alert(data.error);
            }
        } catch (error) {
            alert('Server error. Is Node.js running?');
        }
    }

    function handleLogout() {
        sessionStorage.removeItem('currentUser');
        document.getElementById('dashboard-view').style.display = 'none';
        document.getElementById('login-view').style.display = 'flex';
        document.getElementById('login-user').value = '';
        document.getElementById('login-pass').value = '';
    }

    function showDashboard(username) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        document.getElementById('welcome-msg').innerText = `Welcome, ${username}`;
        loadBookings();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');

        if(tabName === 'bookings') loadBookings();
        if(tabName === 'settings') loadAdmins();
    }

    // ======================= API 调用：预约管理 =======================

    async function loadBookings() {
        const tbody = document.getElementById('bookings-table-body');
        tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Loading...</td></tr>';

        try {
            const res = await fetch('/api/admin/bookings', { headers: getAuthHeaders() });
            if(res.status === 401) return handleLogout();

            const result = await res.json();

            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-muted);">No bookings found.</td></tr>';
                allBookingsData = [];
                renderWeeklyTimetable(); // 清空并渲染空的周历
                return;
            }

            allBookingsData = result.data; // 存入全局变量供周历使用

            // 1. 渲染纯文本表格
            tbody.innerHTML = '';
            result.data.forEach(b => {
                const tr = document.createElement('tr');

                // 🌟 渲染红绿押金标签 (兼容旧数据，如果是 undefined 默认是 No)
                const isPaid = (b.deposit === 'Yes');
                const depositBadge = isPaid
                    ? `<span style="background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid #10B981; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem;">Paid</span>`
                    : `<span style="background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid #EF4444; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem;">No</span>`;

                tr.innerHTML = `
                    <td>#${b.id}</td>
                    <td style="color: var(--primary-blue); font-weight: bold;">${b.date} <br> ${b.time}</td>
                    <td>${b.room}</td>
                    <td>${b.duration} Hrs</td>
                    <td>${b.partySize}</td>
                    <td>${b.name}</td>
                    <td>${b.phone}</td>
                    <td>${depositBadge}</td>
                    <td>
                        <button class="action-btn btn-primary" onclick="openEditBookingModal(${b.id}, '${b.room}', '${b.partySize}', '${b.date}', '${b.time}', '${b.duration}', '${b.name}', '${b.phone}', '${b.deposit || 'No'}')">Edit</button>
                        <button class="action-btn btn-danger" onclick="deleteBooking(${b.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 2. 渲染可视化周历
            renderWeeklyTimetable();

        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="9" style="color: red;">Failed to load data.</td></tr>';
            console.error("加载数据失败:", err);
        }
    }

    async function deleteBooking(id) {
        if(!confirm(`Are you sure you want to delete Booking #${id}? This action cannot be undone.`)) return;
        try {
            const res = await fetch(`/api/admin/bookings/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
            if (res.ok) {
                loadBookings();
            } else {
                alert('Failed to delete booking.');
            }
        } catch (error) {
            console.error('Error deleting booking:', error);
            alert('Network error.');
        }
    }

    // ======================= 核心功能：生成按周显示的课表 =======================

    function changeWeek(offset) {
        currentWeekOffset += offset;
        renderWeeklyTimetable();
    }

    function formatDateStr(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function renderWeeklyTimetable() {
        const container = document.getElementById('timetable-container');
        if (!container) return;
        container.innerHTML = '';

        // 1. 计算当前视图的 7 天日期
        const today = new Date();
        const currentDayOfWeek = today.getDay() || 7;
        const startOfWeek = new Date(today);
        startOfWeek.setDate(today.getDate() - currentDayOfWeek + 1 + (currentWeekOffset * 7));

        const weekDaysInfo = [];
        const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

        for (let i = 0; i < 7; i++) {
            const d = new Date(startOfWeek);
            d.setDate(startOfWeek.getDate() + i);
            weekDaysInfo.push({
                dateObj: d,
                dateStr: formatDateStr(d),
                dayName: dayNames[i]
            });
        }

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        document.getElementById('week-display').innerText = `Week of ${monthNames[startOfWeek.getMonth()]} ${startOfWeek.getDate()}`;

        // 2. 营业时间设置
        const startHour = 18; // 18:00
        const totalHours = 9; // 9个小时
        const PIXELS_PER_MIN = 1; // 1分钟 = 1像素

        // 3. 构建左侧时间轴
        const timeCol = document.createElement('div');
        timeCol.className = 'uni-time-col';
        for (let i = 0; i < totalHours; i++) {
            let displayHour = (startHour + i) % 24;
            let ampm = displayHour >= 12 && displayHour < 24 ? 'PM' : 'AM';
            let hour12 = displayHour > 12 ? displayHour - 12 : (displayHour === 0 ? 12 : displayHour);

            const timeLabel = document.createElement('div');
            timeLabel.className = 'uni-time-label';
            timeLabel.innerText = `${hour12}:00 ${ampm}`;
            timeCol.appendChild(timeLabel);
        }
        container.appendChild(timeCol);

        // 4. 构建右侧 7 天的列
        const dayColsContainer = document.createElement('div');
        dayColsContainer.className = 'uni-day-cols';

        weekDaysInfo.forEach(dayInfo => {
            const col = document.createElement('div');
            col.className = 'uni-day-col';

            const header = document.createElement('div');
            header.className = 'uni-day-header';

            if (dayInfo.dateStr === formatDateStr(new Date())) {
                header.style.borderTop = "3px solid var(--primary-blue)";
                header.style.backgroundColor = "rgba(59, 130, 246, 0.1)";
            }

            header.innerHTML = `<span class="day-name">${dayInfo.dayName}</span><span class="day-date">${dayInfo.dateStr.slice(5)}</span>`;
            col.appendChild(header);

            const eventsArea = document.createElement('div');
            eventsArea.className = 'uni-day-events';

            // 5. 过滤出这一天的所有预约
            const todaysBookings = allBookingsData.filter(b => b.date === dayInfo.dateStr);

            // 🌟 物理房间轨道配置
            const roomConfig = {
                "Small Room":  { baseCol: 0, maxRooms: 2, color: "#3B82F6", label: "S" },
                "Medium Room": { baseCol: 2, maxRooms: 1, color: "#10B981", label: "M" },
                "Large Room":  { baseCol: 3, maxRooms: 2, color: "#F59E0B", label: "V" },
                "VIP Room":    { baseCol: 3, maxRooms: 2, color: "#F59E0B", label: "V" }
            };

            // a. 预处理
            todaysBookings.forEach(b => {
                let [hh, mm] = b.time.split(':').map(Number);
                if (b.time.toLowerCase().includes('pm') && hh !== 12) hh += 12;
                if (b.time.toLowerCase().includes('am') && hh === 12) hh = 0;
                if (hh < startHour) hh += 24;

                b._startMins = ((hh - startHour) * 60) + (mm || 0);
                b._endMins = b._startMins + (parseFloat(b.duration) * 60);
                b._assignedSubCol = 0;
            });

            // b. 防重叠算法
            ['Small Room', 'Medium Room', 'Large Room', 'VIP Room'].forEach(roomType => {
                let bookingsOfType = todaysBookings.filter(b => b.room === roomType);
                if (bookingsOfType.length === 0) return;

                bookingsOfType.sort((a, b) => a._startMins - b._startMins);

                let config = roomConfig[roomType];
                if (!config) return;

                let columnEnds = new Array(config.maxRooms).fill(-1);

                bookingsOfType.forEach(b => {
                    for (let i = 0; i < config.maxRooms; i++) {
                        if (b._startMins >= columnEnds[i]) {
                            b._assignedSubCol = i;
                            columnEnds[i] = b._endMins;
                            break;
                        }
                    }
                });
            });

            // c. 渲染到页面上
            todaysBookings.forEach(b => {
                const config = roomConfig[b.room] || roomConfig["Small Room"];
                const finalColumnIndex = config.baseCol + b._assignedSubCol;

                const slot = document.createElement('div');
                slot.className = 'uni-booking-block';

                slot.style.top = `${b._startMins * PIXELS_PER_MIN}px`;
                slot.style.height = `${(b._endMins - b._startMins) * PIXELS_PER_MIN}px`;

                slot.style.left = `${finalColumnIndex * 20}%`;
                slot.style.width = `20%`;
                slot.style.backgroundColor = config.color;

                slot.innerHTML = `
                <div style="font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">[${config.label}${b._assignedSubCol + 1}] ${b.name}</div>
                <div>${b.partySize}p</div>
            `;

                // 🌟 把 deposit 也传进去，让用户点击周历块也能在弹窗里看到押金状态
                slot.onclick = () => openEditBookingModal(b.id, b.room, b.partySize, b.date, b.time, b.duration, b.name, b.phone, b.deposit || 'No');
                eventsArea.appendChild(slot);
            });

            col.appendChild(eventsArea);
            dayColsContainer.appendChild(col);
        });

        container.appendChild(dayColsContainer);
    }
    // ======================= API 调用：管理员及弹窗管理 =======================

    async function loadAdmins() {
        const tbody = document.getElementById('admins-table-body');
        try {
            const res = await fetch('/api/admin/list', { headers: getAuthHeaders() });
            if(res.status === 401) return handleLogout();

            const admins = await res.json();
            tbody.innerHTML = '';
            const currentUser = sessionStorage.getItem('currentUser');

            admins.forEach(admin => {
                const isMe = admin.username === currentUser;
                const tr = document.createElement('tr');

                let actionButtons = `<button class="action-btn btn-primary" onclick="openEditPassModal(${admin.id}, '${admin.username}')">Change Password</button>`;
                if (!isMe) {
                    actionButtons += `<button class="action-btn btn-danger" onclick="deleteAdmin(${admin.id}, '${admin.username}')">Delete</button>`;
                } else {
                    actionButtons += `<span style="color: var(--text-muted); font-size: 0.8rem; margin-left: 10px;">(You)</span>`;
                }

                tr.innerHTML = `
                    <td>${admin.id}</td>
                    <td style="font-weight: bold;">${admin.username}</td>
                    <td>${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error(err);
        }
    }

    async function submitNewAdmin() {
        const newUsername = document.getElementById('new-admin-user').value.trim();
        const newPassword = document.getElementById('new-admin-pass').value.trim();
        if(!newUsername || !newPassword) return alert('Fill all fields');

        const res = await fetch('/api/admin/add', {
            method: 'POST', headers: getAuthHeaders(),
            body: JSON.stringify({ newUsername, newPassword })
        });
        if (res.ok) {
            closeModal('add-admin-modal');
            loadAdmins();
        } else {
            const data = await res.json();
            alert(data.error);
        }
    }

    async function submitNewPassword() {
        const id = document.getElementById('edit-admin-id').value;
        const newPassword = document.getElementById('edit-new-pass').value.trim();
        if(!newPassword) return alert('Enter new password');

        const res = await fetch(`/api/admin/password/${id}`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify({ newPassword })
        });

        if (res.ok) {
            alert('Password changed successfully');
            closeModal('edit-pass-modal');
        } else {
            alert('Failed to update password');
        }
    }

    async function deleteAdmin(id, username) {
        if(!confirm(`Are you sure you want to permanently delete admin: ${username}?`)) return;
        const res = await fetch(`/api/admin/delete/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
        if (res.ok) loadAdmins();
    }

    function openAddAdminModal() {
        document.getElementById('new-admin-user').value = '';
        document.getElementById('new-admin-pass').value = '';
        document.getElementById('add-admin-modal').style.display = 'flex';
    }

    function openEditPassModal(id, username) {
        document.getElementById('edit-admin-id').value = id;
        document.getElementById('edit-pass-username').innerText = `Editing password for: ${username}`;
        document.getElementById('edit-new-pass').value = '';
        document.getElementById('edit-pass-modal').style.display = 'flex';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // 🌟 修改：接收 deposit 参数，并展示在 UI 上
    function openEditBookingModal(id, room, partySize, date, time, duration, name, phone, deposit) {
        document.getElementById('edit-b-id-display').innerText = id;
        document.getElementById('edit-b-id').value = id;
        document.getElementById('edit-b-room').value = room;
        document.getElementById('edit-b-party').value = partySize;
        document.getElementById('edit-b-date').value = date;
        document.getElementById('edit-b-time').value = time;
        document.getElementById('edit-b-duration').value = duration;
        document.getElementById('edit-b-name').value = name;
        document.getElementById('edit-b-phone').value = phone;

        // 设置押金状态 (如果是旧数据可能会是 undefined，所以用 || 'No' 兜底)
        document.getElementById('edit-b-deposit').value = deposit || 'No';

        document.getElementById('edit-booking-modal').style.display = 'flex';
    }

    async function submitEditBooking() {
        const id = document.getElementById('edit-b-id').value;
        const data = {
            room: document.getElementById('edit-b-room').value,
            partySize: document.getElementById('edit-b-party').value,
            date: document.getElementById('edit-b-date').value,
            time: document.getElementById('edit-b-time').value,
            duration: document.getElementById('edit-b-duration').value,
            name: document.getElementById('edit-b-name').value,
            phone: document.getElementById('edit-b-phone').value,
            // 🌟 获取管理员选择的押金状态
            deposit: document.getElementById('edit-b-deposit').value
        };

        try {
            const res = await fetch(`/api/admin/bookings/${id}`, {
                method: 'PUT',
                headers: getAuthHeaders(),
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeModal('edit-booking-modal');
                loadBookings();
            } else {
                const errData = await res.json();
                alert('Failed: ' + (errData.error || 'Unknown error'));
            }
        } catch (error) {
            console.error('Real error:', error);
            alert('Check console for details.');
        }
    }
